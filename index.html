<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мои Накопления & Финансы</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/lib/index.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        iosBg: '#0b0f19',
                        iosCard: '#161e2e',
                        iosCardSecondary: '#1f293d',
                        iosGreen: '#30d158',
                        iosRed: '#ff453a',
                        iosBlue: '#0a84ff',
                        iosGray: '#8e8e93'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(22, 30, 46, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input, select {
            background-color: #111827 !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        input:focus, select:focus {
            border-color: #0a84ff !important;
            outline: none;
        }
        /* Скрытие полосы прокрутки */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="antialiased pb-12">

    <div class="max-w-md mx-auto px-4 pt-6">
        
        <!-- Шапка -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Копилка & Бюджет</h1>
                <p class="text-xs text-gray-400 mt-0.5">Все данные сохраняются на устройстве</p>
            </div>
            <button onclick="resetData()" class="text-xs bg-red-500/10 text-red-400 px-3 py-1.5 rounded-full border border-red-500/20 active:scale-95 transition">
                <i class="fa-solid fa-trash-can mr-1"></i> Сброс
            </button>
        </div>

        <!-- Главный баланс и Цель -->
        <div class="glass-card rounded-3xl p-5 mb-5 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-xs font-medium uppercase tracking-wider text-gray-400">Чистый баланс</span>
                    <h2 id="totalBalance" class="text-3xl font-extrabold tracking-tight mt-1">0 ₽</h2>
                </div>
                <button onclick="openGoalModal()" class="bg-iosCardSecondary hover:bg-gray-700 text-xs px-3 py-1.5 rounded-xl border border-white/5 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-bullseye text-blue-400"></i> Цель
                </button>
            </div>

            <!-- Прогресс накопления -->
            <div class="mt-5 pt-4 border-t border-white/5">
                <div class="flex justify-between text-xs mb-1.5">
                    <span class="text-gray-400">Цель: <span id="goalTitleText" class="text-white font-medium">Новая машина</span></span>
                    <span id="goalPercent" class="font-semibold text-iosGreen">0%</span>
                </div>
                <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden p-0.5">
                    <div id="goalProgressBar" class="bg-gradient-to-r from-green-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] text-gray-400 mt-1.5">
                    <span>Накоплено: <strong id="currentSaved" class="text-white">0 ₽</strong></span>
                    <span>Цель: <strong id="goalTargetText" class="text-white">100 000 ₽</strong></span>
                </div>
            </div>
        </div>

        <!-- Кнопки быстрого добавления -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="openModal('income')" class="bg-green-500/15 hover:bg-green-500/25 border border-green-500/30 text-green-400 py-3.5 px-4 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-98">
                <i class="fa-solid fa-circle-plus text-base"></i> Доход
            </button>
            <button onclick="openModal('expense')" class="bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-red-400 py-3.5 px-4 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-98">
                <i class="fa-solid fa-circle-minus text-base"></i> Расход
            </button>
        </div>

        <!-- Аналитика / Диаграмма -->
        <div class="glass-card rounded-3xl p-5 mb-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-gray-200">Структура финансов</h3>
                <div class="flex bg-black/30 p-1 rounded-xl text-xs">
                    <button id="chartTabIncome" onclick="switchChartTab('income')" class="px-3 py-1 rounded-lg bg-blue-600 text-white transition font-medium">Доходы</button>
                    <button id="chartTabExpense" onclick="switchChartTab('expense')" class="px-3 py-1 rounded-lg text-gray-400 transition font-medium">Расходы</button>
                </div>
            </div>
            <div class="relative w-full h-48 flex items-center justify-center">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <!-- История операций -->
        <div class="glass-card rounded-3xl p-5 mb-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-semibold text-gray-200">История операций</h3>
                <span id="txCount" class="text-xs text-gray-400">0 записей</span>
            </div>
            <div id="transactionsList" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <!-- Сюда динамически добавляются транзакции -->
                <div class="text-center py-6 text-gray-500 text-xs">История пока пуста</div>
            </div>
        </div>

        <!-- Резервное копирование -->
        <div class="flex gap-2">
            <button onclick="exportJSON()" class="flex-1 bg-iosCardSecondary hover:bg-gray-700 text-xs py-3 rounded-2xl text-gray-300 font-medium border border-white/5 transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-download"></i> Экспорт бэкапа
            </button>
            <label class="flex-1 bg-iosCardSecondary hover:bg-gray-700 text-xs py-3 rounded-2xl text-gray-300 font-medium border border-white/5 transition flex items-center justify-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-upload"></i> Импорт бэкапа
                <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
            </label>
        </div>

    </div>

    <!-- Модальное окно добавления операции -->
    <div id="txModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-gray-900 border border-white/10 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform transition-transform">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-lg font-bold">Добавить операцию</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="txForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="txType" value="income">
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Сумма (₽)</label>
                    <input type="number" id="txAmount" required placeholder="0" class="w-full rounded-2xl px-4 py-3 text-lg font-semibold">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Категория</label>
                    <select id="txCategory" class="w-full rounded-2xl px-4 py-3 text-sm">
                        <!-- Динамически заполняется -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Комментарий (необязательно)</label>
                    <input type="text" id="txComment" placeholder="Например: Зарплата за проект" class="w-full rounded-2xl px-4 py-3 text-sm">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition mt-2">
                    Сохранить
                </button>
            </form>
        </div>
    </div>

    <!-- Модальное окно настройки цели -->
    <div id="goalModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-gray-900 border border-white/10 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Настройка финансовой цели</h3>
                <button onclick="closeGoalModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="handleGoalSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">На что копим?</label>
                    <input type="text" id="goalTitleInput" required class="w-full rounded-2xl px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Целевая сумма (₽)</label>
                    <input type="number" id="goalTargetInput" required class="w-full rounded-2xl px-4 py-3 text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition mt-2">
                    Сохранить цель
                </button>
            </form>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#0b0f19');
        }

        // Категории
        const categories = {
            income: ['Зеркальный доход / ЗП', 'Фриланс / Подработка', 'Подарки', 'Инвестиции', 'Прочее'],
            expense: ['Еда и продукты', 'Жилье / Квартплата', 'Транспорт', 'Развлечения', 'Покупки / Одежда', 'Прочее']
        };

        // Состояние приложения
        let appData = {
            balance: 0,
            goal: { title: 'Новый iPhone', target: 100000 },
            transactions: [] // История транзакций
        };

        let currentChartTab = 'income';
        let myChart = null;

        // Загрузка сохраненных данных
        function loadData() {
            const saved = localStorage.getItem('my_finance_app_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        // Сохранение данных в localStorage
        function saveData() {
            localStorage.setItem('my_finance_app_data', JSON.stringify(appData));
        }

        // Обновление интерфейса
        function updateUI() {
            // Рассчет баланса на основе истории
            let total = 0;
            appData.transactions.forEach(tx => {
                if (tx.type === 'income') total += tx.amount;
                else total -= tx.amount;
            });
            appData.balance = total;

            document.getElementById('totalBalance').innerText = total.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('currentSaved').innerText = total.toLocaleString('ru-RU') + ' ₽';
            
            // Цель
            document.getElementById('goalTitleText').innerText = appData.goal.title;
            document.getElementById('goalTargetText').innerText = appData.goal.target.toLocaleString('ru-RU') + ' ₽';

            let percent = appData.goal.target > 0 ? Math.min(100, Math.max(0, (total / appData.goal.target) * 100)) : 0;
            document.getElementById('goalPercent').innerText = percent.toFixed(1) + '%';
            document.getElementById('goalProgressBar').style.width = percent + '%';

            // Список транзакций
            renderTransactions();
            // График
            updateChart();
            saveData();
        }

        // Рендер истории операций
        function renderTransactions() {
            const listEl = document.getElementById('transactionsList');
            document.getElementById('txCount').innerText = `${appData.transactions.length} записей`;

            if (appData.transactions.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-gray-500 text-xs">История пока пуста</div>`;
                return;
            }

            let html = '';
            // Сортировка: новые сверху
            const sortedTx = [...appData.transactions].reverse();

            sortedTx.forEach((tx) => {
                const isInc = tx.type === 'income';
                const sign = isInc ? '+' : '-';
                const colorClass = isInc ? 'text-iosGreen' : 'text-iosRed';
                const bgIcon = isInc ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400';
                const icon = isInc ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';

                html += `
                    <div class="flex items-center justify-between p-3 bg-white/[0.02] border border-white/5 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl ${bgIcon} flex items-center justify-center text-sm">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-semibold text-white">${tx.category}</h4>
                                <p class="text-[10px] text-gray-400">${tx.comment || 'Без комментария'} • ${tx.date}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold ${colorClass}">${sign}${tx.amount.toLocaleString('ru-RU')} ₽</span>
                            <button onclick="deleteTx('${tx.id}')" class="text-gray-500 hover:text-red-400 text-xs p-1"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // Удаление транзакции
        function deleteTx(id) {
            appData.transactions = appData.transactions.filter(t => t.id !== id);
            updateUI();
        }

        // Открытие модалки добавления
        function openModal(type) {
            document.getElementById('txType').value = type;
            document.getElementById('modalTitle').innerText = type === 'income' ? 'Добавить доход' : 'Добавить расход';
            
            const select = document.getElementById('txCategory');
            select.innerHTML = '';
            categories[type].forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });

            document.getElementById('txAmount').value = '';
            document.getElementById('txComment').value = '';
            document.getElementById('txModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('txModal').classList.add('hidden');
        }

        // Обработка формы добавления транзакции
        function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;
            const comment = document.getElementById('txComment').value.trim();

            if (!amount || amount <= 0) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

            const newTx = {
                id: Date.now().toString(),
                type,
                amount,
                category,
                comment,
                date: dateStr
            };

            appData.transactions.push(newTx);
            closeModal();
            updateUI();
        }

        // Модалка цели
        function openGoalModal() {
            document.getElementById('goalTitleInput').value = appData.goal.title;
            document.getElementById('goalTargetInput').value = appData.goal.target;
            document.getElementById('goalModal').classList.remove('hidden');
        }
        function closeGoalModal() {
            document.getElementById('goalModal').classList.add('hidden');
        }
        function handleGoalSubmit(e) {
            e.preventDefault();
            appData.goal.title = document.getElementById('goalTitleInput').value;
            appData.goal.target = parseFloat(document.getElementById('goalTargetInput').value) || 0;
            closeGoalModal();
            updateUI();
        }

        // Переключение вкладок графика
        function switchChartTab(tab) {
            currentChartTab = tab;
            if (tab === 'income') {
                document.getElementById('chartTabIncome').className = "px-3 py-1 rounded-lg bg-blue-600 text-white transition font-medium";
                document.getElementById('chartTabExpense').className = "px-3 py-1 rounded-lg text-gray-400 transition font-medium";
            } else {
                document.getElementById('chartTabIncome').className = "px-3 py-1 rounded-lg text-gray-400 transition font-medium";
                document.getElementById('chartTabExpense').className = "px-3 py-1 rounded-lg bg-blue-600 text-white transition font-medium";
            }
            updateChart();
        }

        // Построение графика
        function updateChart() {
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            // Фильтруем транзакции по текущей вкладке
            const filtered = appData.transactions.filter(t => t.type === currentChartTab);
            
            // Суммируем по категориям
            const summary = {};
            filtered.forEach(t => {
                summary[t.category] = (summary[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(summary);
            const data = Object.values(summary);

            if (myChart) myChart.destroy();

            if (labels.length === 0) {
                // Пустой график
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Нет данных'],
                        datasets: [{ data: [1], backgroundColor: ['#1f293d'], borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
                return;
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#0a84ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff453a', '#64d2ff'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#9ca3af', boxWidth: 12, font: { size: 10 } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        // Экспорт и импорт бэкапов
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `finance_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        appData = JSON.parse(e.target.result);
                        updateUI();
                        alert('История успешно восстановлена!');
                    } catch (err) {
                        alert('Ошибка чтения файла бэкапа.');
                    }
                };
            }
        }

        function resetData() {
            if (confirm('Сбросить все данные и историю операций?')) {
                appData = { balance: 0, goal: { title: 'Новый iPhone', target: 100000 }, transactions: [] };
                updateUI();
            }
        }

        // Запуск при загрузке
        loadData();
    </script>
</body>
</html>
